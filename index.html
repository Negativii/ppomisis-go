<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ППОО МИСИС — мини-приложение</title>
  <meta name="description" content="Мини-приложение Первичной профсоюзной организации обучающихся МИСИС во ВКонтакте и Telegram" />
  <meta name="theme-color" content="#2950FF" />
  <link rel="icon" href="logo.jpg" />
  <meta property="og:title" content="ППОО МИСИС" />
  <meta property="og:description" content="ППОО МИСИС в твоём телефоне — открой во ВКонтакте или Telegram" />
  <meta property="og:image" content="https://negativii.github.io/ppomisis-go/logo.jpg" />
  <style>
    :root {
      --brand: #2950FF;
      --brand-dark: #1834b8;
      --vk: #0077FF;
      --tg: #27A7E7;
      --text: #0f0f0f;
      --hint: #6b7080;
      --bg: #f2f4fb;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f1f2f5;
        --hint: #9aa0ad;
        --bg: #0e1120;
        --card: #1a1e33;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    /* Шапка растягивается на свободную высоту — кнопки остаются внизу, под большим пальцем */
    .hero {
      flex: 1;
      display: flex; flex-direction: column; justify-content: center;
      background: linear-gradient(160deg, #2f5bff 0%, var(--brand) 45%, var(--brand-dark) 100%);
      color: #fff;
      text-align: center;
      padding: calc(40px + env(safe-area-inset-top)) 20px 64px;
      border-radius: 0 0 32px 32px;
    }
    .logo {
      width: 112px; height: 112px;
      border-radius: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .25);
      display: block; margin: 0 auto 20px;
    }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 10px; font-weight: 800; }
    .lead { font-size: 16px; line-height: 1.5; margin: 0 auto; max-width: 420px; opacity: .92; }

    main {
      width: 100%;
      max-width: 480px;
      margin: -36px auto 0;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 28px rgba(20, 30, 80, .10);
    }
    .card-title { font-size: 15px; font-weight: 700; text-align: center; margin: 0 0 16px; color: var(--hint); }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      min-height: 60px;
      padding: 14px 20px;
      border-radius: 16px;
      color: #fff;
      font-size: 18px; font-weight: 700;
      text-decoration: none;
      transition: transform .12s ease, filter .12s ease;
    }
    .btn + .btn { margin-top: 12px; }
    .btn:active { transform: scale(.97); filter: brightness(.95); }
    .btn svg { width: 28px; height: 28px; flex: none; }
    .btn-vk { background: var(--vk); box-shadow: 0 6px 18px rgba(0, 119, 255, .35); }
    .btn-tg { background: var(--tg); box-shadow: 0 6px 18px rgba(39, 167, 231, .35); }

    /* Узкие телефоны (iPhone SE и т.п.) */
    @media (max-width: 359px) {
      .card { padding: 16px; }
      .btn { font-size: 16px; padding: 14px 12px; gap: 8px; }
      .btn svg { width: 24px; height: 24px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <img class="logo" src="logo.jpg" alt="ППОО МИСИС" width="112" height="112" />
    <h1>Привет! 👋</h1>
    <p class="lead">
      Это мини-приложение Первичной Профсоюзной организации обучающихся&nbsp;МИСИС.
      Профбилет, мероприятия, скидки и помощь&nbsp;— всё в одном месте.
    </p>
  </header>

  <main>
    <section class="card">
      <p class="card-title">Где тебе удобнее?</p>

      <a class="btn btn-vk" href="https://vk.com/app54501350">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.785 16.241s.288-.032.436-.194c.136-.148.132-.427.132-.427s-.02-1.304.576-1.496c.588-.19 1.341 1.26 2.14 1.818.605.422 1.064.33 1.064.33l2.137-.03s1.117-.071.587-.964c-.043-.073-.308-.661-1.588-1.87-1.34-1.264-1.16-1.059.453-3.246.983-1.332 1.376-2.145 1.253-2.493-.117-.332-.84-.244-.84-.244l-2.406.015s-.178-.025-.31.056c-.13.079-.212.262-.212.262s-.382 1.03-.89 1.907c-1.07 1.85-1.499 1.948-1.674 1.832-.407-.267-.305-1.075-.305-1.648 0-1.793.267-2.54-.521-2.733-.262-.065-.454-.107-1.123-.114-.858-.009-1.585.003-1.996.208-.274.136-.485.44-.356.457.159.022.519.099.71.363.246.341.237 1.107.237 1.107s.142 2.11-.33 2.371c-.325.18-.77-.187-1.725-1.865-.489-.859-.859-1.81-.859-1.81s-.07-.176-.198-.272c-.154-.115-.37-.151-.37-.151l-2.286.015s-.343.01-.469.161C3.94 7.721 4.043 8 4.043 8s1.79 4.258 3.817 6.403c1.858 1.967 3.968 1.838 3.968 1.838h.957z"/></svg>
        Открыть во ВКонтакте
      </a>

      <a class="btn btn-tg" href="https://t.me/ppoo_misis_bot">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.78 15.27l-.4 5.6c.57 0 .82-.25 1.12-.54l2.68-2.57 5.56 4.07c1.02.57 1.74.27 2.02-.94l3.66-17.15h.001c.32-1.51-.55-2.1-1.54-1.73L1.33 8.16c-1.47.57-1.45 1.39-.25 1.76l5.52 1.72 12.82-8.02c.6-.4 1.15-.18.7.22z" transform="translate(-.6 .4) scale(.95)"/></svg>
        Открыть в Telegram
      </a>
    </section>
  </main>

</body>
</html>
